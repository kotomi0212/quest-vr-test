<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>90秒VR刺激プレビュー</title>
<style>body{font:16px system-ui;background:#eef1f4;color:#253241;margin:0}.page{max-width:1150px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}.description{color:#5e6b78}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:white;border:1px solid #d2dbe4;border-radius:8px;padding:13px}.card strong{display:block;font-size:22px;margin-top:5px}iframe{width:100%;height:480px;border:1px solid #cad3dd;background:#b8bcc2;border-radius:8px}.controls{display:flex;gap:12px;align-items:center;margin:14px 0}button{font:inherit;border:0;border-radius:6px;background:#245f90;color:white;padding:10px 18px}input{flex:1}#live{font-variant-numeric:tabular-nums}.panel{background:white;border-radius:8px;padding:18px;margin-top:22px}.plot{width:100%;display:block}.amplitudes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.amplitudes div{border-bottom:1px solid #e2e7eb;padding:7px;font-size:13px}.small{font-size:13px;color:#607080}a{color:#245f90}#error{color:#9e2424}</style></head><body><main class="page">
<h1>90秒・加速度振幅一定マルチコサイン</h1>
<div class="description">灰色の格子部屋／幅6 m・高さ3 m／正面壁まで3 m／格子間隔50 cm／AP並進のみ</div>
<div class="cards"><div class="card">最大絶対速度<strong id="max-v">—</strong></div><div class="card">最大絶対変位<strong id="max-x">—</strong></div><div class="card">各加速度成分<strong id="component">—</strong></div></div>
<iframe id="view" src="visual-scene.html" title="実装と同じ格子部屋の単眼プレビュー"></iframe>
<div class="controls"><button id="play">再生</button><button id="reset">先頭へ</button><input id="time" type="range" min="0" max="90" step="0.01" value="0"><span id="elapsed">0.00 / 90 s</span></div>
<div id="live">読込中…</div><p class="small">0～10秒は滑らかに接続。10～90秒は振幅一定。90秒で静止に接続します。プレビューは単眼・固定視点です。</p><p id="error"></p>
<section class="panel"><h2>変位・速度・加速度と30成分</h2><img class="plot" src="data/waveforms.png" alt="刺激波形と各周波数の加速度振幅"><p><a href="data/stimulus.csv">時系列CSV</a>　<a href="data/component_amplitudes.csv">30成分の振幅CSV</a>　<a href="data/stimulus.json">刺激条件・位相</a></p></section>
<section class="panel"><h2>各周波数の加速度振幅</h2><div class="amplitudes" id="amplitudes"></div><p class="small">10～90秒の80秒間を独立に調和回帰して確認した片振幅（m/s²）。</p></section>
</main><script src="visual-preview.js"></script></body></html>
