<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest 視覚刺激表示・パイロット</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>body{margin:0;font-family:system-ui;background:#edf4f7}#info{position:fixed;top:8px;left:8px;z-index:10;background:#ffffffdc;border-radius:9px;padding:10px 14px;max-width:440px;font-size:14px}#info b{display:block}#info small{display:block}</style>
<script>
'use strict';
const previewMode=new URLSearchParams(location.search).has('preview');
const appConfig=window.VR_REMOTE_CONFIG;
if(!appConfig){alert('firebase-config.js がありません');throw Error('config missing');}
firebase.initializeApp(appConfig.firebase);
const auth=firebase.auth(), db=firebase.database();
const root=db.ref('sessions/'+appConfig.sessionId);
let sceneReady=previewMode, firstCommand=true, active=null, lastCommandSeq=0;
let headsetUser=null, currentAngle=0;
let anklePivot=new THREE.Vector3(0,0.08,0), calibrated=previewMode;
const info=()=>document.querySelector('#status');
function showStatus(msg){const n=info();if(n)n.textContent=msg;}
function setRotation(deg){ currentAngle=deg; const room=document.querySelector('#visual-world'); if(room){room.object3D.rotation.x=deg*Math.PI/180;const rotated=anklePivot.clone().applyAxisAngle(new THREE.Vector3(1,0,0),deg*Math.PI/180);room.object3D.position.copy(anklePivot).sub(rotated);} }
function safeName(name){ return /^[a-zA-Z0-9_.-]+\.csv$/.test(name)&&!name.includes('..'); }
function parseCsv(content){
 const lines=content.trim().split(/\r?\n/);const points=[];
 for(const line of lines){const p=line.trim();if(!p||p.startsWith('#')||p.toLowerCase().startsWith('time'))continue;
  const [ts, deg]=p.split(',').map(x=>Number(x.trim()));
  if(Number.isFinite(ts)&&Number.isFinite(deg)&&ts>=0&&Math.abs(deg)<=45)points.push([ts,deg]); }
 if(points.length<2) throw Error('CSV requires two or more time_s,angle_deg rows');
 points.sort((a,b)=>a[0]-b[0]);return points;
}
function interp(points, time){
 if(time<=points[0][0])return points[0][1];
 if(time>=points[points.length-1][0])return points[points.length-1][1];
 let a=0,b=points.length-1;
 while(a+1<b){const mid=(a+b)>>1;if(points[mid][0]<=time)a=mid;else b=mid;}
 const p=points[a],q=points[b],u=(time-p[0])/(q[0]-p[0]);
 return p[1]+u*(q[1]-p[1]);
}
function ack(status,detail={}){
 if(previewMode||!headsetUser)return;
 root.child('status').set({status,...detail,at:firebase.database.ServerValue.TIMESTAMP,questUid:headsetUser.uid}).catch(console.error);
}
async function finish(reason='completed'){
 if(!active)return;
 const trial=active;active=null;setRotation(0);
 showStatus('完了 ('+reason+') / 次の指示を待っています');ack('idle',{lastRunId:trial.cmd.runId,reason});
 const payload={mode:trial.cmd.mode,frequencyHz:trial.cmd.frequencyHz||0,amplitudeDeg:trial.cmd.amplitudeDeg||0,
 durationSec:trial.cmd.durationSec, runId:trial.cmd.runId, reason,
 startedAtQuestWallClockMs:trial.startedWallMs, endedAtQuestWallClockMs:Date.now(),
 anklePivotM:anklePivot.toArray(),heightCm:trial.cmd.heightCm||null,eyeHeightM:trial.cmd.eyeHeightM||null,samples:trial.samples, csvFile:trial.cmd.csvFile||null,
 note:'Quest Date.now is not automatically synchronized with other sensors. samples=[elapsed_ms, visual_world_rotation_deg]'};
 if(previewMode)return;
 try{await root.child('logs/'+headsetUser.uid+'/'+trial.cmd.runId).set(payload);}catch(e){showStatus('ログ保存失敗: '+e.message);console.error(e);}
}
async function handleCommand(cmd){
 if(!cmd||!Number.isFinite(cmd.seq)||cmd.seq<=lastCommandSeq)return;
 lastCommandSeq=cmd.seq;
 if(cmd.type==='calibrate'){
 if(!sceneReady){showStatus('先にVRに入ってください');return;}
 if(active){showStatus('停止してから位置合わせしてください');return;}
 const cam=document.querySelector('a-camera');
 if(previewMode){cam.setAttribute('position',{x:0,y:Number(cmd.eyeHeightM)||1.5,z:0});anklePivot.set(0,Number(cmd.ankleHeightM)||0,0);}
 else{const v=new THREE.Vector3();cam.object3D.getWorldPosition(v);anklePivot.set(v.x,Number(cmd.ankleHeightM)||0,v.z);}
 calibrated=true;setRotation(0);showStatus('足首位置合わせ完了（頭の真下で近似）');ack('ready',{calibrated:true,anklePivot:anklePivot.toArray()});return;
 }
 if(cmd.type==='stop'){await finish('stopped');return;}
 if(cmd.type!=='start')return;
 if(!sceneReady){showStatus('VRに入ってから開始してください');ack('blocked',{error:'enter VR before START'});return;}
 if(!calibrated){showStatus('PCで立ち位置を合わせてください');ack('blocked',{error:'立ち位置合わせが必要です'});return;}
 if(previewMode){document.querySelector('a-camera').setAttribute('position',{x:0,y:Number(cmd.eyeHeightM)||1.5,z:0});anklePivot.set(0,Number(cmd.ankleHeightM)||0,0);}
 if(active)await finish('replaced');
 const trial={cmd:{...cmd},samples:[],startedPerf:null,startedWallMs:null,preludePerf:performance.now(),points:null};
 if(cmd.mode==='csv'){
  if(!safeName(cmd.csvFile||'')){showStatus('CSVファイル名が不正');ack('blocked',{error:'bad csv filename'});return;}
  try{const r=await fetch('./'+cmd.csvFile,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);trial.points=parseCsv(await r.text());}
  catch(e){showStatus('CSV読込エラー: '+e.message);ack('blocked',{error:'csv load: '+e.message});return;}
 }
 active=trial;setRotation(0);showStatus('開始待機（3秒）: '+cmd.mode);ack('countdown',{runId:cmd.runId});
}
AFRAME.registerComponent('stimulus-driver',{
 tick:function(){
  if(!active)return;
  const p=performance.now();
  if(active.startedPerf===null){
   if(p-active.preludePerf<3000)return;
   active.startedPerf=p;active.startedWallMs=Date.now();
   showStatus('再生中: '+active.cmd.mode+' / '+active.cmd.runId);
   ack('running',{runId:active.cmd.runId,startedAtQuestWallClockMs:active.startedWallMs});
  }
  const t=(p-active.startedPerf)/1000,cmd=active.cmd;
  if(t>=Number(cmd.durationSec||60)){void finish('completed');return;}
  let deg=0;
  if(cmd.mode==='sine')deg=Number(cmd.amplitudeDeg)*Math.sin(2*Math.PI*Number(cmd.frequencyHz)*t);
  if(cmd.mode==='csv')deg=interp(active.points,t);
  setRotation(deg);
  active.samples.push([Math.round(t*1000),Math.round(deg*100000)/100000]);
 }
});
window.addEventListener('load',()=>{
 const world=document.querySelector('#visual-world');
 function box(pos,size,color){const n=document.createElement('a-box');n.setAttribute('position',pos);n.setAttribute('width',size[0]);n.setAttribute('height',size[1]);n.setAttribute('depth',size[2]);n.setAttribute('color',color);world.appendChild(n);}
 for(let z=-8.5;z<3;z+=0.6)box('0 0.008 '+z,[9.9,0.008,0.016],'#8d765d');
 for(let x=-4.5;x<5;x+=1)box(x+' 0.009 -3',[0.014,0.009,11.9],'#a18a70');
 // Far-right shelving with books. Approximation, not paper coordinates.
 box('4.5 1.25 -6.9',[0.55,2.5,2.5],'#675442');
 for(let level=0;level<4;level++){
  box('4.15 '+(0.25+level*0.6)+' -6.9',[0.8,0.07,2.5],'#ccb89a');
  for(let j=0;j<6;j++)box('4.1 '+(0.5+level*0.6)+' '+(-7.9+j*0.32),[0.35,0.42,0.14],['#778f9b','#b08d72','#d8c9a5'][j%3]);
 }

 const scene=document.querySelector('a-scene');
 if(previewMode){document.querySelector('#info').style.display='none';scene.setAttribute('vr-mode-ui','enabled',false);}
 scene.addEventListener('enter-vr',()=>{sceneReady=true;showStatus('室内版 v4：PCで立ち位置を合わせてください');ack('ready',{calibrated:false});});
 scene.addEventListener('exit-vr',()=>{sceneReady=false;calibrated=previewMode;void finish('vr-exited');showStatus('VR終了。再度Enter VRしてください');});
});
(previewMode ? new Promise(resolve=>auth.onAuthStateChanged(user=>{if(user)resolve({user});})) : auth.signInAnonymously()).then(cred=>{
 headsetUser=cred.user;showStatus(previewMode?'PC刺激プレビュー':'Firebase 接続済み。QuestでEnter VRを押してください');
 root.child('command').on('value',snap=>{
  const c=snap.val();if(firstCommand){firstCommand=false;lastCommandSeq=c?.seq||0;return;}
  void handleCommand(c);
 },e=>showStatus('Firebase購読エラー: '+e.message));
 ack('connected');
}).catch(e=>showStatus('Firebase認証エラー: '+e.message));
</script>
</head><body>
<div id="info"><b>室内版 v4・足首位置合わせ対応</b>
<span id="status">接続中...</span>
<small>まずQuest内で「Enter VR」を押し、その後PCで開始してください。固定・転倒防止は別途必要です。</small></div>
<a-scene webxr="referenceSpaceType: local-floor" stimulus-driver background="color: #e8eef7" vr-mode-ui="enabled: true">
  <!-- Approximate modern room: dimensions and furnishings are design choices, not recovered from the paper. Origin = ankle/floor. -->
  <a-entity id="visual-world">
    <a-box position="0 -0.06 -3" width="10" height="0.12" depth="12" color="#b59b7c"></a-box>
    <a-box position="0 3.5 -3" width="10" height="0.1" depth="12" color="#f0eee9"></a-box>
    <a-box position="-5 1.75 -3" width="0.12" height="3.5" depth="12" color="#e4e1da"></a-box>
    <a-box position="5 1.75 -3" width="0.12" height="3.5" depth="12" color="#d8dfe0"></a-box>
    <a-box position="0 1.75 -9" width="10" height="3.5" depth="0.12" color="#ede9e1"></a-box>
    <a-box position="0 1.75 3" width="10" height="3.5" depth="0.12" color="#ede9e1"></a-box>
    <a-plane position="0 0.015 -4.3" rotation="-90 0 0" width="4.6" height="3.2" color="#829496"></a-plane>
    <!-- Left: sofa and framed artwork -->
    <a-box position="-3.2 0.4 -3.5" width="1.5" height="0.65" depth="3" color="#747f86"></a-box>
    <a-box position="-3.8 0.85 -3.5" width="0.3" height="1.1" depth="3" color="#65717a"></a-box>
    <a-box position="-3.2 0.75 -2" width="1.5" height="0.55" depth="0.22" color="#65717a"></a-box>
    <a-box position="-3.2 0.75 -5" width="1.5" height="0.55" depth="0.22" color="#65717a"></a-box>
    <a-box position="-4.91 2.15 -4" width="0.05" height="1.2" depth="1.9" color="#51463b"></a-box>
    <a-box position="-4.87 2.15 -4" width="0.04" height="1.02" depth="1.72" color="#a7bbb4"></a-box>
    <!-- Coffee table -->
    <a-box position="-0.5 0.55 -4" width="1.9" height="0.12" depth="1" color="#715744"></a-box>
    <a-box position="-1.2 0.27 -4" width="0.1" height="0.54" depth="0.8" color="#383c40"></a-box>
    <a-box position="0.2 0.27 -4" width="0.1" height="0.54" depth="0.8" color="#383c40"></a-box>
    <a-box position="-0.7 0.65 -4" width="0.45" height="0.08" depth="0.3" color="#e4d8c1"></a-box>
    <!-- Back: window and right-side cabinet -->
    <a-box position="-2.5 2 -8.9" width="3" height="1.9" depth="0.1" color="#627681"></a-box>
    <a-box position="-2.5 2 -8.82" width="2.8" height="1.7" depth="0.04" color="#b5d6e4" material="shader: flat"></a-box>
    <a-box position="-2.5 2 -8.77" width="0.07" height="1.7" depth="0.05" color="#f7f5ee"></a-box>
    <a-box position="-2.5 2 -8.77" width="2.8" height="0.07" depth="0.05" color="#f7f5ee"></a-box>
    <a-box position="2.7 0.6 -8" width="3" height="1.2" depth="0.65" color="#997f61"></a-box>
    <a-box position="2.6 1.9 -8.87" width="2.5" height="1.25" depth="0.1" color="#303c44"></a-box>
    <a-box position="2.6 1.9 -8.79" width="2.3" height="1.06" depth="0.03" color="#71818a"></a-box>
    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.85; color: #fff5e6"></a-entity>
    <a-entity light="type: directional; intensity: 0.65" position="-2 3 1"></a-entity>
  </a-entity>
  <a-entity position="0 0 0"><a-camera wasd-controls="enabled: false" look-controls="enabled: true"></a-camera></a-entity>
</a-scene>
 
 
</body></html>
