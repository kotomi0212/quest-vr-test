<script>
window.vrLastError='';
function reportStartupError(text){
 window.vrLastError=String(text);
 const n=document.getElementById('startup-error');
 if(n){n.hidden=false;n.textContent='起動エラー：'+window.vrLastError;}
}
window.addEventListener('error',e=>{if(e.message)reportStartupError(e.message);},true);
window.addEventListener('unhandledrejection',e=>reportStartupError([e.reason?.message||e.reason,e.reason?.cause?.message].filter(Boolean).join(' / ')));
</script>
<script defer crossorigin="anonymous" src="https://aframe.io/releases/1.7.0/aframe.min.js" onerror="reportStartupError('A-Frameの取得に失敗しました。ネットワークを確認してください。')"></script>
