window.vrLastError='';
function reportStartupError(text){
 window.vrLastError=String(text);
 const n=document.getElementById('startup-error');
 if(n){n.hidden=false;n.textContent='起動エラー：'+window.vrLastError;}
}
window.addEventListener('error',e=>{if(e.message)reportStartupError(e.message);},true);
window.addEventListener('unhandledrejection',e=>reportStartupError(e.reason?.message||e.reason));
</script>

<script>
(() => {
 if(!window.AFRAME){reportStartupError('A-Frameが読み込めません。ネットワークを確認してください。');return;}

'use strict';
const THREE=AFRAME.THREE;
const scene=document.querySelector('#scene-template').content.firstElementChild.cloneNode(true);

const previewMode=new URLSearchParams(location.search).has('preview');
const appConfig=window.VR_REMOTE_CONFIG;
let auth=null,db=null,root=null;
let sceneReady=previewMode, firstCommand=true, active=null, lastCommandSeq=0;
let headsetUser=null, currentAngle=0;
let anklePivot=new THREE.Vector3(0,0.08,0), calibrated=previewMode;
const info=()=>document.querySelector('#status');
function showStatus(msg){const n=info();if(n)n.textContent=msg;}
function setRotation(deg){ currentAngle=deg; const room=scene.querySelector('#visual-world'); if(room){room.object3D.rotation.x=deg*Math.PI/180;const rotated=anklePivot.clone().applyAxisAngle(new THREE.Vector3(1,0,0),deg*Math.PI/180);room.object3D.position.copy(anklePivot).sub(rotated);} }
function safeName(name){ return /^[a-zA-Z0-9_.-]+\.csv$/.test(name)&&!name.includes('..'); }
function parseCsv(content){
 const lines=content.trim().split(/\r?\n/);const points=[];
 for(const line of lines){const p=line.trim();if(!p||p.startsWith('#')||p.toLowerCase().startsWith('time'))continue;
  const [ts, deg]=p.split(',').map(x=>Number(x.trim()));
  if(Number.isFinite(ts)&&Number.isFinite(deg)&&ts>=0&&Math.abs(deg)<=45)points.push([ts,deg]); }
 if(points.length<2) throw Error('CSV requires two or more time_s,angle_deg rows');
 points.sort((a,b)=>a[0]-b[0]);if(points.some((p,i)=>i&&p[0]<=points[i-1][0]))throw Error('CSVの時刻が重複しています');return points;
}
function interp(points, time){
 if(time<=points[0][0])return points[0][1];
 if(time>=points[points.length-1][0])return points[points.length-1][1];
 let a=0,b=points.length-1;
 while(a+1<b){const mid=(a+b)>>1;if(points[mid][0]<=time)a=mid;else b=mid;}
 const p=points[a],q=points[b],u=(time-p[0])/(q[0]-p[0]);
 return p[1]+u*(q[1]-p[1]);
}
function ack(status,detail={}){
 if(previewMode||!headsetUser||!root)return;
 root.child('status').set({status,...detail,at:firebase.database.ServerValue.TIMESTAMP,questUid:headsetUser.uid}).catch(console.error);
}
async function finish(reason='completed'){
 if(!active)return;
 const trial=active;active=null;setRotation(0);
 showStatus('完了 ('+reason+') / 次の指示を待っています');ack('idle',{lastRunId:trial.cmd.runId,reason});
 const payload={mode:trial.cmd.mode,frequencyHz:trial.cmd.frequencyHz||0,amplitudeDeg:trial.cmd.amplitudeDeg||0,
 durationSec:trial.cmd.durationSec, runId:trial.cmd.runId, reason,
 startedAtQuestWallClockMs:trial.startedWallMs, endedAtQuestWallClockMs:Date.now(),
 anklePivotM:anklePivot.toArray(),heightCm:trial.cmd.heightCm||null,eyeHeightM:trial.cmd.eyeHeightM||null,samples:trial.samples, csvFile:trial.cmd.csvFile||null,
 note:'Quest Date.now is not automatically synchronized with other sensors. samples=[elapsed_ms, visual_world_rotation_deg]'};
 if(previewMode)return;
 try{await root.child('logs/'+headsetUser.uid+'/'+trial.cmd.runId).set(payload);}catch(e){showStatus('ログ保存失敗: '+e.message);console.error(e);}
}
async function handleCommand(cmd){
 if(!cmd||!Number.isFinite(cmd.seq)||cmd.seq<=lastCommandSeq)return;
 lastCommandSeq=cmd.seq;
 if(cmd.type==='calibrate'){
 if(!sceneReady){showStatus('先にVRに入ってください');return;}
 if(active){showStatus('停止してから位置合わせしてください');return;}
 const cam=scene.querySelector('a-camera');
 if(previewMode){cam.setAttribute('position',{x:0,y:Number(cmd.eyeHeightM)||1.5,z:0});anklePivot.set(0,Number(cmd.ankleHeightM)||0,0);}
 else{const v=new THREE.Vector3();const xrCamera=scene.renderer.xr.getCamera(scene.camera);xrCamera.getWorldPosition(v);anklePivot.set(v.x,Number(cmd.ankleHeightM)||0,v.z);}
 calibrated=true;setRotation(0);showStatus('足首位置合わせ完了（頭の真下で近似）');ack('ready',{calibrated:true,anklePivot:anklePivot.toArray()});return;
 }
 if(cmd.type==='stop'){await finish('stopped');ack('idle',{reason:'stopped',calibrated});return;}
 if(cmd.type!=='start')return;
 if(!['baseline','sine','csv'].includes(cmd.mode)||!Number.isFinite(cmd.durationSec)||cmd.durationSec<5||cmd.durationSec>600||
 (cmd.mode==='sine'&&(!Number.isFinite(cmd.frequencyHz)||cmd.frequencyHz<=0||cmd.frequencyHz>2||!Number.isFinite(cmd.amplitudeDeg)||cmd.amplitudeDeg<0||cmd.amplitudeDeg>20))){ack('blocked',{error:'刺激設定が不正です'});return;}
 if(!sceneReady){showStatus('VRに入ってから開始してください');ack('blocked',{error:'enter VR before START'});return;}
 if(!calibrated){showStatus('PCで立ち位置を合わせてください');ack('blocked',{error:'立ち位置合わせが必要です'});return;}
 if(previewMode){document.querySelector('a-camera').setAttribute('position',{x:0,y:Number(cmd.eyeHeightM)||1.5,z:0});anklePivot.set(0,Number(cmd.ankleHeightM)||0,0);}
 if(active)await finish('replaced');
 const trial={cmd:{...cmd},samples:[],startedPerf:null,startedWallMs:null,preludePerf:performance.now(),points:null};
 if(cmd.mode==='csv'){
  if(!safeName(cmd.csvFile||'')){showStatus('CSVファイル名が不正');ack('blocked',{error:'bad csv filename'});return;}
  try{const r=await fetch('./'+cmd.csvFile,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);trial.points=parseCsv(await r.text());}
  catch(e){showStatus('CSV読込エラー: '+e.message);ack('blocked',{error:'csv load: '+e.message});return;}
 }
 if(cmd.seq!==lastCommandSeq)return;
 trial.preludePerf=performance.now();
 active=trial;setRotation(0);showStatus('開始待機（3秒）: '+cmd.mode);ack('countdown',{runId:cmd.runId});
}
AFRAME.registerComponent('stimulus-driver',{
 tick:function(){
  if(!active)return;
  const p=performance.now();
  if(active.startedPerf===null){
   if(p-active.preludePerf<3000)return;
   active.startedPerf=p;active.startedWallMs=Date.now();
   showStatus('再生中: '+active.cmd.mode+' / '+active.cmd.runId);
   ack('running',{runId:active.cmd.runId,startedAtQuestWallClockMs:active.startedWallMs});
  }
  const t=(p-active.startedPerf)/1000,cmd=active.cmd;
  if(t>=Number(cmd.durationSec||60)){void finish('completed');return;}
  let deg=0;
  if(cmd.mode==='sine')deg=Number(cmd.amplitudeDeg)*Math.sin(2*Math.PI*Number(cmd.frequencyHz)*t);
  if(cmd.mode==='csv')deg=interp(active.points,t);
  setRotation(deg);
  active.samples.push([Math.round(t*1000),Math.round(deg*100000)/100000]);
 }
});
if(previewMode){
 document.querySelector('#info').style.display='none';
 scene.setAttribute('xr-mode-ui','enabled: false');
}
scene.addEventListener('enter-vr',()=>{
 if(!scene.renderer?.xr.isPresenting)return;
 sceneReady=true;calibrated=false;
 document.querySelector('#info').style.display='none';
 ack('ready',{calibrated:false});
});
scene.addEventListener('exit-vr',()=>{
 sceneReady=false;calibrated=previewMode;void finish('vr-exited');
 if(!previewMode)document.querySelector('#info').style.display='block';
 showStatus('VR終了。右下の標準VRボタンで再開してください');
});
scene.addEventListener('loaded',()=>{showStatus('室内読込完了。右下の標準VRボタンで開始してください');});
scene.addEventListener('renderstart',()=>{
 window.clearTimeout(startupTimer);
 document.querySelector('#startup-error').hidden=true;
});
scene.addEventListener('render-target-loaded',()=>{
 scene.canvas?.addEventListener('webglcontextlost',()=>{
  void finish('graphics-lost');reportStartupError('3D描画が停止しました。Quest Browserを再読み込みしてください。');
 });
});
const startupTimer=window.setTimeout(()=>{
 if(!scene.renderStarted)reportStartupError('3D空間の初期化が完了していません。'+(window.vrLastError||'Quest Browserを再読み込みしてください。'));
},12000);
document.body.appendChild(scene);
// A failed Firebase connection must never prevent rendering or hide the standard VR button.
async function connectFirebase(){
 if(!window.firebase||!appConfig?.firebase){showStatus('Firebase設定の読み込みに失敗。VR空間は単独表示できます。');return;}
 firebase.initializeApp(appConfig.firebase);
 auth=firebase.auth();db=firebase.database();root=db.ref('sessions/'+appConfig.sessionId);
(previewMode ? new Promise(resolve=>auth.onAuthStateChanged(user=>{if(user)resolve({user});})) : auth.signInAnonymously()).then(cred=>{
 headsetUser=cred.user;showStatus(previewMode?'PC刺激プレビュー':'Firebase 接続済み。QuestでEnter VRを押してください');
 root.child('command').on('value',snap=>{
  const c=snap.val();if(firstCommand){firstCommand=false;lastCommandSeq=c?.seq||0;return;}
  void handleCommand(c);
 },e=>showStatus('Firebase購読エラー: '+e.message));
 ack(sceneReady?'ready':'connected',{calibrated});
}).catch(e=>showStatus('Firebase認証エラー: '+e.message));

}
void connectFirebase().catch(e=>showStatus("Firebase接続エラー："+e.message));

})();
</script>
