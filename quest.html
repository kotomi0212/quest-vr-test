<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest 視覚刺激表示・パイロット</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>body{margin:0;font-family:system-ui;background:#edf4f7}#info{position:fixed;top:8px;left:8px;z-index:10;background:#ffffffdc;border-radius:9px;padding:10px 14px;max-width:440px;font-size:14px}#info b{display:block}#info small{display:block}</style>
<script>
'use strict';
const previewMode=new URLSearchParams(location.search).has('preview');
const appConfig=window.VR_REMOTE_CONFIG;
if(!appConfig){alert('firebase-config.js がありません');throw Error('config missing');}
firebase.initializeApp(appConfig.firebase);
const auth=firebase.auth(), db=firebase.database();
const root=db.ref('sessions/'+appConfig.sessionId);
let sceneReady=previewMode, firstCommand=true, active=null, lastCommandSeq=0;
let headsetUser=null, currentAngle=0;
const info=()=>document.querySelector('#status');
function showStatus(msg){const n=info();if(n)n.textContent=msg;}
function setRotation(deg){ currentAngle=deg; const room=document.querySelector('#visual-world'); if(room)room.object3D.rotation.x=deg*Math.PI/180; }
function safeName(name){ return /^[a-zA-Z0-9_.-]+\.csv$/.test(name)&&!name.includes('..'); }
function parseCsv(content){
 const lines=content.trim().split(/\r?\n/);const points=[];
 for(const line of lines){const p=line.trim();if(!p||p.startsWith('#')||p.toLowerCase().startsWith('time'))continue;
  const [ts, deg]=p.split(',').map(x=>Number(x.trim()));
  if(Number.isFinite(ts)&&Number.isFinite(deg)&&ts>=0&&Math.abs(deg)<=45)points.push([ts,deg]); }
 if(points.length<2) throw Error('CSV requires two or more time_s,angle_deg rows');
 points.sort((a,b)=>a[0]-b[0]);return points;
}
function interp(points, time){
 if(time<=points[0][0])return points[0][1];
 if(time>=points[points.length-1][0])return points[points.length-1][1];
 let a=0,b=points.length-1;
 while(a+1<b){const mid=(a+b)>>1;if(points[mid][0]<=time)a=mid;else b=mid;}
 const p=points[a],q=points[b],u=(time-p[0])/(q[0]-p[0]);
 return p[1]+u*(q[1]-p[1]);
}
function ack(status,detail={}){
 if(previewMode||!headsetUser)return;
 root.child('status').set({status,...detail,at:firebase.database.ServerValue.TIMESTAMP,questUid:headsetUser.uid}).catch(console.error);
}
async function finish(reason='completed'){
 if(!active)return;
 const trial=active;active=null;setRotation(0);
 showStatus('完了 ('+reason+') / 次の指示を待っています');ack('idle',{lastRunId:trial.cmd.runId,reason});
 const payload={mode:trial.cmd.mode,frequencyHz:trial.cmd.frequencyHz||0,amplitudeDeg:trial.cmd.amplitudeDeg||0,
 durationSec:trial.cmd.durationSec, runId:trial.cmd.runId, reason,
 startedAtQuestWallClockMs:trial.startedWallMs, endedAtQuestWallClockMs:Date.now(),
 samples:trial.samples, csvFile:trial.cmd.csvFile||null,
 note:'Quest Date.now is not automatically synchronized with other sensors. samples=[elapsed_ms, visual_world_rotation_deg]'};
 if(previewMode)return;
 try{await root.child('logs/'+headsetUser.uid+'/'+trial.cmd.runId).set(payload);}catch(e){showStatus('ログ保存失敗: '+e.message);console.error(e);}
}
async function handleCommand(cmd){
 if(!cmd||!Number.isFinite(cmd.seq)||cmd.seq<=lastCommandSeq)return;
 lastCommandSeq=cmd.seq;
 if(cmd.type==='stop'){await finish('stopped');return;}
 if(cmd.type!=='start')return;
 if(!sceneReady){showStatus('VRに入ってから開始してください');ack('blocked',{error:'enter VR before START'});return;}
 if(active)await finish('replaced');
 const trial={cmd:{...cmd},samples:[],startedPerf:null,startedWallMs:null,preludePerf:performance.now(),points:null};
 if(cmd.mode==='csv'){
  if(!safeName(cmd.csvFile||'')){showStatus('CSVファイル名が不正');ack('blocked',{error:'bad csv filename'});return;}
  try{const r=await fetch('./'+cmd.csvFile,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);trial.points=parseCsv(await r.text());}
  catch(e){showStatus('CSV読込エラー: '+e.message);ack('blocked',{error:'csv load: '+e.message});return;}
 }
 active=trial;setRotation(0);showStatus('開始待機（3秒）: '+cmd.mode);ack('countdown',{runId:cmd.runId});
}
AFRAME.registerComponent('stimulus-driver',{
 tick:function(){
  if(!active)return;
  const p=performance.now();
  if(active.startedPerf===null){
   if(p-active.preludePerf<3000)return;
   active.startedPerf=p;active.startedWallMs=Date.now();
   showStatus('再生中: '+active.cmd.mode+' / '+active.cmd.runId);
   ack('running',{runId:active.cmd.runId,startedAtQuestWallClockMs:active.startedWallMs});
  }
  const t=(p-active.startedPerf)/1000,cmd=active.cmd;
  if(t>=Number(cmd.durationSec||60)){void finish('completed');return;}
  let deg=0;
  if(cmd.mode==='sine')deg=Number(cmd.amplitudeDeg)*Math.sin(2*Math.PI*Number(cmd.frequencyHz)*t);
  if(cmd.mode==='csv')deg=interp(active.points,t);
  setRotation(deg);
  active.samples.push([Math.round(t*1000),Math.round(deg*100000)/100000]);
 }
});
window.addEventListener('load',()=>{
 const scene=document.querySelector('a-scene');
 if(previewMode){document.querySelector('#info').style.display='none';scene.setAttribute('vr-mode-ui','enabled',false);}
 scene.addEventListener('enter-vr',()=>{sceneReady=true;showStatus('VR準備完了。PCのSTART待ち');ack('ready');});
 scene.addEventListener('exit-vr',()=>{sceneReady=false;void finish('vr-exited');showStatus('VR終了。再度Enter VRしてください');});
});
(previewMode ? new Promise(resolve=>auth.onAuthStateChanged(user=>{if(user)resolve({user});})) : auth.signInAnonymously()).then(cred=>{
 headsetUser=cred.user;showStatus(previewMode?'PC刺激プレビュー':'Firebase 接続済み。QuestでEnter VRを押してください');
 root.child('command').on('value',snap=>{
  const c=snap.val();if(firstCommand){firstCommand=false;lastCommandSeq=c?.seq||0;return;}
  void handleCommand(c);
 },e=>showStatus('Firebase購読エラー: '+e.message));
 ack('connected');
}).catch(e=>showStatus('Firebase認証エラー: '+e.message));
</script>
</head><body>
<div id="info"><b>視覚刺激パイロット（未検証の実験補助ツール）</b>
<span id="status">接続中...</span>
<small>まずQuest内で「Enter VR」を押し、その後PCで開始してください。固定・転倒防止は別途必要です。</small></div>
<a-scene stimulus-driver background="color: #e8eef7" vr-mode-ui="enabled: true">
  <a-entity id="visual-world">
    <a-sky color="#c8dff2"></a-sky>
    <a-plane position="0 -1.6 -4" rotation="-90 0 0" width="200" height="200" color="#8daa9b" material="side: double"></a-plane>
    <a-box position="-4 0 -8" width="0.25" height="5" depth="0.25" color="#ecfbff"></a-box>
    <a-box position="4 0 -8" width="0.25" height="5" depth="0.25" color="#ecfbff"></a-box>
    <a-box position="-4 2.5 -8" width="8" height="0.25" depth="0.25" color="#ecfbff"></a-box>
    <a-box position="-4 0 -20" width="1" height="5" depth="1" color="#538672"></a-box>
    <a-box position="4 0 -20" width="1" height="5" depth="1" color="#538672"></a-box>
    <a-box position="-4 0 -35" width="1" height="5" depth="1" color="#538672"></a-box>
    <a-box position="4 0 -35" width="1" height="5" depth="1" color="#538672"></a-box>
    <a-box position="0 -0.4 -15" width="0.15" height="0.15" depth="30" color="#ffffff"></a-box>
  </a-entity>
  <a-entity position="0 0 0"><a-camera wasd-controls="enabled: false" look-controls="enabled: true"></a-camera></a-entity>
</a-scene>
</body></html>
