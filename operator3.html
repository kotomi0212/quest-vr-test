<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>前後並進スイープ 操作画面</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="ap-sweep-config.js?v=2"></script>
  <script src="ap-sweep-stimulus.js?v=2"></script>
  <style>
    body{font:16px system-ui;max-width:760px;margin:28px auto;padding:0 18px;background:#f3f5f6;color:#17232c}
    section{background:#fff;border:1px solid #d5dde1;border-radius:12px;padding:18px;margin:14px 0}
    h1{font-size:25px}label{display:block;font-weight:650;margin:11px 0 4px}input,button{box-sizing:border-box;padding:10px;border:1px solid #aebbc2;border-radius:7px;font:inherit}input{width:100%}
    button{cursor:pointer;background:#e8edf0}.primary{color:#fff;background:#176b92;border-color:#176b92}.danger{color:#fff;background:#a93434;border-color:#a93434}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{font-size:13px;color:#52636c}
    #state{font-weight:700;color:#176444}#message{padding:11px;border-radius:7px;background:#eaf3f8;min-height:24px}iframe{width:100%;height:320px;border:0;border-radius:9px;background:#8f969a}
    @media(max-width:600px){.grid,.buttons{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Quest 前後並進・対数周波数スイープ</h1>
  <p class="muted">回転刺激を含まない独立サイトです。正のAP位置・速度は前方（A-Frameの−Z方向）として記録します。</p>
  <section id="login">
    <h2>1. 実験者ログイン</h2>
    <label for="email">Firebase Auth のメール</label><input id="email" type="email" autocomplete="username">
    <label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password">
    <p><button id="signIn" class="primary">ログイン</button></p><div id="authState"></div>
  </section>
  <section id="control" hidden>
    <h2>2. 刺激設定と操作</h2>
    <p>Quest状態：<span id="state">確認中</span></p><p id="diagnostics" class="muted"></p>
    <iframe id="preview" title="並進刺激プレビュー"></iframe>
    <p class="muted">プレビューは形状確認用です。Questの実表示時刻や追跡姿勢とは一致しません。</p>
    <div class="grid">
      <div><label for="startFrequency">開始周波数 (Hz)</label><input id="startFrequency" type="number" min="0.01" max="5" step="0.01"></div>
      <div><label for="endFrequency">終了周波数 (Hz)</label><input id="endFrequency" type="number" min="0.01" max="5" step="0.01"></div>
      <div><label for="duration">刺激／Baseline時間 (秒)</label><input id="duration" type="number" min="5" max="1800" step="1"></div>
      <div><label for="velocityAmplitude">速度振幅 (m/s)</label><input id="velocityAmplitude" type="number" min="0.001" max="1" step="0.001"></div>
      <div><label for="roomSize">立方体の一辺 (m)</label><input id="roomSize" type="number" min="2" max="20" step="0.1"></div>
      <div><label for="gridSpacing">格子間隔 (m)</label><input id="gridSpacing" type="number" min="0.1" step="0.1"></div>
    </div>
    <p id="summary" class="muted"></p>
    <p><button id="configure">部屋設定を反映</button> <button id="calibrate">立ち位置を合わせる</button></p>
    <div class="buttons"><button id="start" class="primary">スイープSTART（3秒後）</button><button id="baseline">Baseline START（3秒後）</button></div>
    <div class="buttons" style="margin-top:10px"><button id="stop" class="danger">STOP（2秒で原点へ）</button><button id="emergency" class="danger">緊急停止（即時）</button></div>
    <p><button id="csvDownload">ログCSV出力</button> <button id="jsonDownload">ログJSON出力</button></p>
    <p id="message" role="status" aria-live="polite">QuestでVRを開始し、立ち位置を合わせてください。</p>
  </section>
  <script src="ap-sweep-operator.js?v=2"></script>
</body>
</html>
